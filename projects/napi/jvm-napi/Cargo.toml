[package]
name = "jvm-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node-API bindings for JVM class and jar inspection"

[lib]
name = "jvm_napi"
path = "src/lib.rs"
