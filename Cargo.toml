[workspace]
resolver = "2"
members = [
    "projects/runtime/jvm",
    "projects/napi/jvm-napi",
]
default-members = ["projects/runtime/jvm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/nyar-vm/jvm"

[workspace.dependencies]
# 格式与执行基座。CI 用 git `rev` 解析；本机路径写在 `.cargo/config.toml`。
data-binary-jvm = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
interpreter-vm-jvm = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }

jvm = { path = "projects/runtime/jvm" }

serde_json = "1.0.154"
napi = { version = "3.14.2", default-features = true, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2"

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
